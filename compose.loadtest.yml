name: openzltravel-loadtest

services:
  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: openzltravelcatalog
      POSTGRES_USER: catalogowner
      POSTGRES_PASSWORD: catalogowner
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - loadtestdb:/var/lib/postgresql/data
      - ./backend/loadtests/postgres_init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./backend/database/app.sql:/docker-entrypoint-initdb.d/10-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogowner -d openzltravelcatalog"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - loadtest

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - loadtest

  fake-upstream:
    build:
      context: .
      dockerfile: backend/loadtests/Dockerfile
    command:
      - python
      - -m
      - uvicorn
      - loadtests.fake_upstream:app
      - --host
      - 0.0.0.0
      - --port
      - "9000"
      - --workers
      - "1"
    environment:
      FAKE_SCENARIO: ${LOADTEST_SCENARIO:-normal}
      FAKE_SLOW_LLM_SECONDS: ${FAKE_SLOW_LLM_SECONDS:-2}
      FAKE_TIMEOUT_DELAY_SECONDS: ${FAKE_TIMEOUT_DELAY_SECONDS:-2}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - loadtest

  app:
    build:
      context: .
      dockerfile: backend/loadtests/Dockerfile
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "4"
    environment:
      DATABASE_URL: postgresql://travelapp:travelapp@database:5432/openzltravelcatalog
      CATALOG_DATABASE_URL: postgresql://travelapp:travelapp@database:5432/openzltravelcatalog
      DATABASE_POOL_MIN_SIZE: "2"
      DATABASE_POOL_MAX_SIZE: "20"
      CATALOG_POOL_MIN_SIZE: "1"
      CATALOG_POOL_MAX_SIZE: "4"
      REDIS_URL: redis://redis:6379/0
      RECOVERY_SCAN_SECONDS: "1"
      API_RATE_LIMIT_PER_MINUTE: "100000"
      ALLOW_AMAP_FALLBACK: "true"
      AMAP_API_KEY: fake-loadtest-key
      AMAP_BASE_URL: http://fake-upstream:9000/amap/v3
      AMAP_TIMEOUT_SECONDS: "1"
      AMAP_MIN_INTERVAL_SECONDS: "0"
      AMAP_SCHEDULER_CONCURRENCY: "2"
      AMAP_RATE_LIMIT_COOLDOWN_SECONDS: "2"
      OPEN_METEO_BASE_URL: http://fake-upstream:9000/open-meteo/v1/forecast
      OPEN_METEO_TIMEOUT_SECONDS: "1"
      RAIL_MCP_URL: http://fake-upstream:9000/rail/mcp
      RAIL_MCP_TIMEOUT_SECONDS: "1"
      DIDA_MCP_URL: http://fake-upstream:9000/hotel/mcp
      DIDA_API_KEY: fake-loadtest-token
      DIDA_MCP_TIMEOUT_SECONDS: "1"
      ROLLINGGO_HOTEL_TOKEN_PATH: /data/no-rollinggo-token.json
      LLM_API_KEY: fake-loadtest-key
      LLM_BASE_URL: http://fake-upstream:9000/v1
      LLM_MODEL: fake-model
      LLM_TIMEOUT_SECONDS: "1"
      LLM_ENHANCEMENT_TIMEOUT_SECONDS: "1"
      INTENT_LLM_TIMEOUT_SECONDS: "1"
      PROVIDER_CONCURRENCY: "4"
      PROVIDER_FAILURE_THRESHOLD: "3"
      PROVIDER_COOLDOWN_SECONDS: "2"
    depends_on:
      fake-upstream:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - loadtest

  locust:
    build:
      context: .
      dockerfile: backend/loadtests/Dockerfile
    command:
      - python
      - -m
      - locust
      - -f
      - loadtests/locustfile.py
      - --headless
      - --host
      - http://app:8000
      - --csv
      - /results/locust
      - --csv-full-history
      - --only-summary
    environment:
      LOADTEST_STAGES: ${LOADTEST_STAGES:-10:30,50:60,200:90,500:120}
      LOADTEST_RESULTS_DIR: /results
      FAKE_UPSTREAM_URL: http://fake-upstream:9000
      LOADTEST_POLL_TIMEOUT_SECONDS: "12"
    volumes:
      - ${LOADTEST_RESULT_DIR:-./loadtests/results/current}:/results
    depends_on:
      app:
        condition: service_healthy
    networks:
      - loadtest

networks:
  loadtest:
    internal: true

volumes:
  loadtestdb:
