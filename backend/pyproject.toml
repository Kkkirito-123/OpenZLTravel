[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openzltravel"
version = "1.0.0"
description = "独立 AI 旅行助手与轻量 LangGraph 规划服务"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "langchain>=1.1,<2.0",
    "langchain-openai>=1.1,<2.0",
    "langgraph>=1.2,<2.0",
    "langgraph-sdk>=0.4,<0.5",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic>=2.12,<3.0",
    "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.4.31,<0.5",
    "mypy>=1.17,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.12,<1.0",
]
catalog = [
    "osmium>=4.3,<5.0",
]
eval = [
    "langsmith>=0.10,<1.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
    "benchmarks*",
    "catalog_builder*",
    "openzltravel*",
]

[tool.setuptools.package-data]
benchmarks = ["data/*.json", "data/*.jsonl"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
packages = ["openzltravel", "benchmarks"]
