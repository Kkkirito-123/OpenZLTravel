services:
  catalogdb:
    image: postgis/postgis:16-3.4
    container_name: openzltravelcatalog
    restart: unless-stopped
    environment:
      POSTGRES_DB: openzltravelcatalog
      POSTGRES_USER: catalogowner
      POSTGRES_PASSWORD: ${CATALOG_POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - openzltravelcatalogdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogowner -d openzltravelcatalog"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: openzltravelredis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - openzltravelredisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  openzltravelcatalogdata:
    name: openzltravelcatalogdata
  openzltravelredisdata:
    name: openzltravelredisdata
